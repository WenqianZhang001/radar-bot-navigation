# Local-costmap overlay: processed, aging occupancy, not raw radar clouds.
# Merge into the robot's validated Humble Nav2 params using scripts/prepare_nav2.py.
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.1
      track_unknown_space: false
      use_maximum: false
      trinary_costmap: true
      lethal_cost_threshold: 65
      plugins: ["radar_layer", "inflation_layer"]
      radar_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /radar_front/occupancy
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 3.0
